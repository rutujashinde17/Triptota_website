<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Booking History · TripTora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/common.css">
  <style>
    .bh-wrap {
      max-width: 1040px;
      margin: 30px auto 60px;
    }
    .bh-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .bh-head h2 {
      font-size: 26px;
      color: var(--maroon);
    }
    .bh-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    .bh-tab {
      background: #fff;
      border: 1px solid var(--border-color);
      color: var(--maroon);
      padding: 7px 18px;
      border-radius: var(--radius-full);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
    }
    .bh-tab.active {
      background: var(--maroon);
      color: #fff;
      border-color: var(--maroon);
    }
    .booking-card {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 22px 26px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 18px;
      transition: all 0.2s;
    }
    .booking-card:hover {
      border-color: var(--peach);
      box-shadow: var(--shadow);
    }
    .b-info h4 {
      font-size: 18px;
      color: var(--maroon);
      margin-bottom: 4px;
    }
    .b-info p {
      font-size: 13.5px;
      color: var(--text-muted);
    }
    .b-meta {
      display: flex;
      gap: 16px;
      font-size: 12.5px;
      margin-top: 8px;
    }
    .b-pnr {
      font-weight: 700;
      color: var(--orange);
    }
    .b-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .back-nav {
      margin-bottom: 18px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--orange);
      font-weight: 600;
      font-size: 13.5px;
    }

    @media (max-width: 640px) {
      .booking-card {
        flex-direction: column;
        align-items: flex-start;
      }
      .b-actions {
        width: 100%;
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>
  <!-- Universal Navbar mount -->
  <header id="tt-navbar-mount"></header>

  <main class="page-wrapper" style="padding-top: var(--nav-height);">
    <div class="container">
      <div class="bh-wrap">
        <a href="profile.html" class="back-nav">← Back to Profile Overview</a>

        <div class="bh-head">
          <div>
            <h2>My Booking History &amp; Itineraries</h2>
            <p style="color:var(--text-muted); font-size:13.5px;">View your past journeys, upcoming flight &amp; bus departures, and holiday vouchers.</p>
          </div>
          <a href="../flight/results.html" class="btn btn-primary btn-sm">+ Book New Trip</a>
        </div>

        <div class="bh-tabs">
          <button class="bh-tab active" data-filter="all">All Bookings</button>
          <button class="bh-tab" data-filter="flight">Flights ✈️</button>
          <button class="bh-tab" data-filter="bus">Buses 🚌</button>
          <button class="bh-tab" data-filter="package">Tour Packages 🌴</button>
        </div>

        <div id="bookingsList"></div>
      </div>
    </div>
  </main>

  <!-- Universal Footer mount -->
  <footer id="tt-footer-mount"></footer>

  <script src="../../js/common.js"></script>
  <script>
    const DEFAULT_BOOKINGS = [
      {
        type: "flight",
        title: "Bengaluru (BLR) → Goa (GOI) · Non-Stop",
        details: "IndiGo 6E-542 · 1 Adult · Economy · Seat 12A",
        date: "2026-11-20 · Departure 06:15 AM",
        amount: "₹4,250",
        pnr: "6E7841",
        status: "Confirmed"
      },
      {
        type: "bus",
        title: "Pune (Swargate) → Goa (Panaji)",
        details: "Zingbus Electric Multi-Axle · AC Sleeper (Berth L4)",
        date: "2026-11-28 · Boarding 21:30 PM",
        amount: "₹1,249",
        pnr: "ZB9923",
        status: "Confirmed"
      },
      {
        type: "package",
        title: "Bali, Beautifully Slow Holiday Tour",
        details: "5 Days / 4 Nights · 4-star boutique stay & transfers",
        date: "2026-10-14 · Completed",
        amount: "₹32,500",
        pnr: "TP8812",
        status: "Completed"
      }
    ];

    function getBookings() {
      let stored = [];
      try {
        stored = JSON.parse(localStorage.getItem('triptora_bookings') || '[]');
      } catch (e) {}

      if (!stored || stored.length === 0) {
        localStorage.setItem('triptora_bookings', JSON.stringify(DEFAULT_BOOKINGS));
        return DEFAULT_BOOKINGS;
      }
      return stored;
    }

    function renderBookings(filter = "all") {
      const container = document.getElementById('bookingsList');
      const all = getBookings();
      const filtered = filter === "all" ? all : all.filter(b => b.type === filter);

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding:60px 20px; background:#fff; border-radius:16px; border:1px solid var(--border-color);">
            <div style="font-size:42px; margin-bottom:12px;">🧳</div>
            <h4 style="color:var(--maroon); margin-bottom:6px;">No bookings found in this category</h4>
            <p style="color:var(--text-muted); font-size:13.5px; margin-bottom:20px;">Ready for your next adventure? Find great deals on flights and buses.</p>
            <a href="../flight/results.html" class="btn btn-primary">Search Flights Now</a>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(b => `
        <div class="booking-card">
          <div class="b-info">
            <span class="badge ${b.status === 'Confirmed' ? 'badge-green' : 'badge-yellow'}" style="margin-bottom:6px;">
              ${b.status}
            </span>
            <h4>${b.title}</h4>
            <p>${b.details}</p>
            <div class="b-meta">
              <span>📅 ${b.date}</span>
              <span class="b-pnr">PNR: ${b.pnr}</span>
              <span style="font-weight:700; color:var(--maroon);">Fare: ${typeof b.amount === 'number' ? '₹' + b.amount.toLocaleString('en-IN') : b.amount}</span>
            </div>
          </div>
          <div class="b-actions">
            <button class="btn btn-outline btn-sm" onclick="downloadTicket('${b.pnr}')">📄 Download Ticket</button>
            <a href="refund.html?ref=${b.pnr}" class="btn btn-outline btn-sm" style="color:var(--red); border-color:#fad5d3;">Cancel / Refund</a>
          </div>
        </div>
      `).join('');
    }

    window.downloadTicket = function(pnr) {
      if (window.ttToast) {
        window.ttToast("📥 Downloading official E-Ticket & Invoice for PNR " + pnr + " (PDF)...");
      }
    };

    document.querySelectorAll('.bh-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.bh-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        renderBookings(tab.dataset.filter);
      });
    });

    renderBookings("all");
  </script>
</body>
</html>
