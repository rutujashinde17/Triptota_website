<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile &amp; Trips · TripTora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../css/common.css">
  <style>
    :root {
      --wine: var(--maroon, #95241F);
      --wine2: #7A1915;
      --orange: #FF8A42;
      --cream: #FFF6F0;
      --paper: #fff;
      --ink: #260A0A;
      --muted: #7A6A60;
      --line: #F1E2CC;
      --sage: #E8F3EB;
      --green: #2E7D4F;
      --gold: #FEBD71;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    ul, ol {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    button, input, select, textarea { font: inherit; }

    .workspace-shell {
      flex: 1 0 auto;
      padding-top: var(--nav-height);
    }

    .profile-subbar {
      display: none;
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 10px 16px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .user-menu {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--peach-soft, #FFF0E8);
      border: 1.5px solid var(--peach, #FBBF9B);
      color: var(--wine);
      display: grid;
      place-items: center;
      font-weight: 700;
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    .layout {
      display: flex;
      min-height: calc(100vh - var(--nav-height) - 60px);
    }

    .sidebar {
      width: 240px;
      background: #fff;
      border-right: 1px solid var(--line);
      padding: 26px 16px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }

    .side-label {
      font-size: 10.5px;
      letter-spacing: 1px;
      color: var(--muted);
      font-weight: 700;
      margin: 0 10px 14px;
    }

    .navlink {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      text-decoration: none;
      padding: 12px 14px;
      border-radius: 10px;
      margin: 2px 0;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .navlink:hover {
      background: var(--peach-soft, #FFF0E8);
      color: var(--wine);
    }

    .navlink.active {
      background: var(--orange);
      color: #fff;
      font-weight: 600;
    }

    .navlink i { font-size: 16px; }

    .navlink-logout {
      width: 100%;
      background: #fff5f3;
      border: 1px solid #f2cbc2;
      color: var(--wine);
      font-weight: 600;
      text-align: left;
      margin-top: 8px;
    }

    .navlink-logout:hover {
      background: var(--wine);
      border-color: var(--wine);
      color: #fff;
    }

    .navlink-delete {
      width: 100%;
      background: #FDE8E7;
      border: 1px solid #F5B7B1;
      color: #C0392B;
      font-weight: 600;
      text-align: left;
      margin-top: 8px;
    }

    .navlink-delete:hover {
      background: #C0392B;
      border-color: #C0392B;
      color: #fff;
    }

    .alert-danger-soft {
      background: #FDE8E7;
      border: 1px solid #F5B7B1;
      color: #922B21;
      border-radius: 10px;
      padding: 14px;
    }

    .btn-danger-trip {
      background: #C0392B;
      border: 1px solid #C0392B;
      color: #fff;
      border-radius: 10px;
      padding: 10px 18px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-danger-trip:hover:not(:disabled) {
      background: #922B21;
      border-color: #922B21;
      color: #fff;
    }

    .btn-danger-trip:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .delete-confirm-box {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: #fff8f6;
      border: 1px solid #f5c6cb;
      border-radius: 10px;
      padding: 12px 14px;
      margin-top: 12px;
      cursor: pointer;
    }

    .delete-confirm-box input[type="checkbox"] {
      margin-top: 3px;
      width: 16px;
      height: 16px;
      accent-color: #C0392B;
      flex-shrink: 0;
      cursor: pointer;
    }

    .side-note {
      background: var(--cream);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 17px;
      margin-top: 24px;
      color: var(--wine);
    }

    .side-note strong {
      display: block;
      font-size: 15px;
      margin: 8px 0 4px;
    }

    .side-note p {
      font-size: 12px;
      color: var(--muted);
      margin: 0;
    }

    .main {
      flex: 1;
      min-width: 0;
      padding: 30px clamp(18px, 3vw, 44px) 48px;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--wine);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .page-title {
      color: var(--wine);
      font-size: clamp(26px, 3vw, 36px);
      font-weight: 700;
      margin: 0 0 6px;
      line-height: 1.2;
    }

    .sub {
      color: var(--muted);
      margin-bottom: 22px;
    }

    .cardx {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 2px 10px rgba(38, 10, 10, 0.06);
    }

    .cardx h5, .section-title {
      color: var(--wine);
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 16px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin: 20px 0;
    }

    .stat {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: 18px;
      box-shadow: 0 2px 10px rgba(38, 10, 10, 0.04);
    }

    .stat .cap { color: var(--muted); font-size: 12px; font-weight: 500; }
    .stat strong { display: block; color: var(--wine); font-size: 26px; margin: 6px 0 3px; }
    .stat small { color: var(--muted); font-size: 11.5px; }

    .hero {
      display: grid;
      grid-template-columns: 0.9fr 1.3fr;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 17px;
      overflow: hidden;
      margin: 20px 0;
      box-shadow: 0 2px 12px rgba(38, 10, 10, 0.06);
    }

    .hero-copy {
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero h2 {
      font-size: 28px;
      font-weight: 700;
      color: var(--wine);
      margin: 12px 0;
    }

    .hero img {
      width: 100%;
      height: 290px;
      object-fit: cover;
    }

    .btn-trip {
      background: var(--orange);
      border: 1px solid var(--orange);
      color: #fff;
      border-radius: 10px;
      padding: 10px 18px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-trip:hover { background: var(--wine); border-color: var(--wine); color: #fff; }
    .btn-trip:disabled { opacity: 0.65; cursor: not-allowed; }

    .btn-outline-trip {
      background: #fff;
      border: 1.5px solid var(--peach, #FBBF9B);
      color: var(--wine);
      border-radius: 10px;
      padding: 9px 16px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-outline-trip:hover:not(:disabled) {
      background: var(--peach-soft, #FFF0E8);
      border-color: var(--orange);
      color: var(--wine);
    }

    .btn-outline-trip:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-link-trip {
      border: 0;
      background: none;
      color: var(--wine);
      font-weight: 700;
      text-decoration: none;
      padding: 0;
      cursor: pointer;
    }

    .btn-link-trip:hover { color: var(--orange); }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
    .gridwide { display: grid; grid-template-columns: 1.4fr 0.8fr; gap: 16px; margin-top: 16px; }
    .muted { color: var(--muted); }
    .tiny { font-size: 11.5px; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 30px;
      background: var(--sage);
      color: var(--green);
      font-size: 11px;
      font-weight: 700;
      width: fit-content;
    }

    .pill.warn { background: #FFF1D9; color: #94631B; }
    .pill.red { background: #FDE8E7; color: #C0392B; }

    .table-wrap { overflow-x: auto; }
    .table { min-width: 820px; vertical-align: middle; margin-bottom: 10px; }
    .table thead th {
      background: var(--cream);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      border: 0;
      padding: 13px 12px;
      text-transform: uppercase;
    }
    .table tbody td {
      padding: 16px 12px;
      border-color: var(--line);
      font-size: 12.5px;
    }
    .table tbody td .btn-link-trip { white-space: nowrap; }
    .table tbody tr:last-child td { border-bottom: 0; }

    .form-control, .form-select {
      border: 1.5px solid var(--line);
      border-radius: 9px;
      padding: 10px 12px;
      font-size: 13.5px;
    }

    .form-control:focus, .form-select:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 0.2rem rgba(255, 138, 66, 0.2);
    }

    .form-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
    }

    .filterbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .filterbar .form-control { min-width: 265px; max-width: 320px; }
    .filterbar .form-select { max-width: 210px; }

    .booking-cover {
      height: 230px;
      width: 100%;
      object-fit: cover;
      border-radius: 13px;
    }

    .detail-hero {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 17px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .info-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .info-pair small { display: block; color: var(--muted); font-size: 11px; margin-bottom: 4px; }
    .info-pair strong { font-size: 13px; }
    .amount { font: 700 26px 'Poppins', sans-serif; color: var(--wine); }

    .alert-soft {
      background: #FFF3D9;
      border: 0;
      color: #795A2B;
      border-radius: 10px;
      padding: 14px;
    }

    .alert-success-soft {
      background: var(--sage);
      color: var(--green);
      border: 0;
      border-radius: 10px;
      padding: 14px;
    }

    .timeline {
      border-left: 2px solid var(--peach, #FBBF9B);
      margin-left: 10px;
      padding-left: 22px;
    }

    .step { position: relative; padding: 0 0 20px; }
    .step:before {
      content: '';
      position: absolute;
      left: -30px;
      top: 2px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--sage);
      border: 3px solid var(--green);
    }
    .step.pending:before { background: #FFF1D9; border-color: var(--orange); }

    .profile-banner { height: 155px; border-radius: 15px 15px 0 0; object-fit: cover; width: 100%; }
    .profile-head { display: flex; align-items: center; gap: 18px; padding: 0 22px 20px; }
    .profile-head .avatar { width: 72px; height: 72px; font-size: 23px; border: 4px solid #fff; margin-top: -30px; }
    .field-value { font-weight: 600; margin-top: 3px; }
    .field-block { margin-bottom: 16px; }

    .modal-content { border: 0; border-radius: 18px; padding: 8px; }
    .modal-header, .modal-footer { border: 0; padding: 14px 20px; }
    .modal-body { padding: 10px 20px 18px; }
    .modal-title { color: var(--wine); font-weight: 700; }

    .rating button { border: 0; background: none; color: #d8d0c8; font-size: 27px; padding: 0 2px; cursor: pointer; }
    .rating button.selected { color: #e7ad55; }

    .empty { text-align: center; padding: 60px 20px; }
    .empty i { font-size: 36px; color: var(--orange); }

    .ai-chip {
      border: 1.5px solid var(--peach, #FBBF9B);
      background: var(--peach-soft, #FFF0E8);
      color: var(--wine);
      border-radius: 999px;
      padding: 5px 13px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .ai-chip:hover {
      background: var(--wine);
      border-color: var(--wine);
      color: #fff;
    }

    .ai-reply-box {
      background: var(--cream);
      border: 1px solid var(--peach, #FBBF9B);
      border-radius: 12px;
      padding: 16px 18px;
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--ink);
      white-space: pre-wrap;
    }

    .mobile-menu { display: none; }
    .hide { display: none !important; }
    .text-danger { color: var(--wine) !important; }

    @media (max-width: 1050px) {
      .sidebar { width: 205px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .gridwide { grid-template-columns: 1fr; }
      .hero { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 760px) {
      .profile-subbar { display: flex; padding: 10px 14px; }
      .mobile-menu { display: inline-flex; }
      .layout { display: block; }
      .sidebar {
        display: none;
        position: fixed;
        z-index: 950;
        top: var(--nav-height);
        bottom: 0;
        left: 0;
        width: 265px;
        box-shadow: 10px 0 30px rgba(0, 0, 0, 0.15);
      }
      .sidebar.open { display: flex; }
      .main { padding: 22px 14px 36px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .hero { grid-template-columns: 1fr; }
      .hero img { min-height: 190px; max-height: 230px; grid-row: 1; }
      .hero-copy { padding: 22px; }
      .grid2, .detail-grid { grid-template-columns: 1fr; }
      .cardx { padding: 18px; }
      .filterbar > * { max-width: none !important; flex: 1 1 100%; }
      .profile-head { align-items: flex-start; flex-wrap: wrap; }
    }

    @media (max-width: 420px) {
      .stats { grid-template-columns: 1fr; }
      .user-name { display: none; }
      .info-pair { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <!-- Universal Navbar mount -->
  <header id="tt-navbar-mount"></header>

  <div class="workspace-shell">
    <div class="profile-subbar">
      <button class="btn-outline-trip mobile-menu" type="button" onclick="toggleSidebar()">
        <i class="bi bi-list"></i> Workspace Menu
      </button>
      <button class="btn-outline-trip" id="profileMobileLogoutBtn" type="button" onclick="window.logoutTripTora && window.logoutTripTora()" style="color:var(--wine);border-color:#f2cbc2;padding:7px 14px;font-size:13px;">
        <i class="bi bi-box-arrow-right"></i> Logout
      </button>
    </div>

    <div id="app"></div>
  </div>

  <!-- Action Modal (Cancel / Photo Preview) -->
  <div class="modal fade" id="actionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" id="modalBody"></div>
    </div>
  </div>

  <!-- Universal Footer mount -->
  <footer id="tt-footer-mount"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/common.js"></script>
  <script>

      }
    ];

    const seedRefunds = [
      {

    const seedProfile = {
      first: 'Maya',

      photo: ''
    };

    let bookings = [];
    let refunds = [];
    let profile = { ...seedProfile };

    function syncFromStorage() {
      bookings = JSON.parse(localStorage.getItem('tp_bookings') || 'null') || seedBookings.map(x => ({ ...x }));
      refunds = JSON.parse(localStorage.getItem('tp_refunds') || 'null') || seedRefunds.map(x => ({ ...x }));

      // Sync profile with active TripTora login session
      try {
        const authSession = JSON.parse(localStorage.getItem('triptoraUser') || 'null');
        if (authSession) {
          const sEmail = (authSession.email || '').trim().toLowerCase();
          const sName = (authSession.username || (sEmail ? sEmail.split('@')[0] : '')).trim();
          if (sEmail && profile.email.toLowerCase() !== sEmail) {
            const parts = sName.split(/\s+/).filter(Boolean);
            profile = {
              ...profile,
              first: parts[0] || sName || 'Explorer',
              last: parts.slice(1).join(' '),
              email: sEmail,
              phone: authSession.phone || profile.phone
            };
          }
        }
      } catch (e) {}

      // Sync any newly booked TripTora checkouts (flight/bus/holiday package) into tp_bookings
      try {
        const siteBookings = JSON.parse(localStorage.getItem('triptora_bookings') || '[]');
        siteBookings.forEach(sb => {
          const refId = sb.pnr || sb.id;
          if (refId && !bookings.some(b => b.id === refId)) {
            const numAmt = typeof sb.amount === 'number'
              ? sb.amount
              : Number(String(sb.amount || '0').replace(/[^\d.]/g, '')) || 0;
            bookings.unshift({
              id: refId,
              name: sb.title || 'TripTora Booking',
              dest: sb.details || 'India / International',
              dates: sb.date || 'Upcoming',
              start: '2026-12-01',
              travellers: 1,
              date: new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }),
              amount: numAmt,
              payment: sb.status === 'Pending Payment' ? 'Pending' : 'Paid',
              status: sb.status === 'Cancelled' ? 'Cancelled' : (sb.status === 'Completed' ? 'Completed' : 'Confirmed'),
              image: imgFallbackBali,
              fallback: imgFallbackBali,
              desc: sb.details || 'Booked directly through TripTora.',
              transaction: 'PAY-' + refId
            });
          }
        });
      } catch (e) {}
    }

    syncFromStorage();

    function confirmCancel(id) {
      const b = bookings.find(x => x.id === id);
      if (!b || b.status !== 'Confirmed') {
        notify('This booking cannot be cancelled.');
        return;
      }
      const reason = document.getElementById('cancelReason').value;
      const fee = Math.round(b.amount * 0.1 * 100) / 100;
      b.status = 'Cancelled';
      b.payment = 'Refunding';
      refunds.unshift({
        id: 'CN-' + Date.now().toString().slice(-6),
        booking: id,
        name: b.name,
        reason,
        date: '08 Nov 2026',
        amount: b.amount - fee,
        method: 'Visa •••• 4242',
        bookingStatus: 'Cancelled',
        status: 'Processing',
        transaction: '— Pending',
        paid: b.amount,
        fee,
        requested: '08 Nov 2026 · 09:10',
        approved: '08 Nov 2026 · 09:15',
        processing: '08 Nov 2026 · 09:20'
      });
      save();
      closeModalSafe();
      currentRefund = refunds[0].id;

    function filterRefunds() {
      const q = document.getElementById('refundSearch').value.toLowerCase();

      let n = 0;
      document.querySelectorAll('#refundRows tr').forEach(tr => {
        const ok = tr.dataset.search.includes(q) && (!s || tr.dataset.status === s);
        tr.classList.toggle('hide', !ok);
        if (ok) n++;
      });
      document.getElementById('refundTableWrap').classList.toggle('hide', n === 0);
      document.getElementById('refundEmpty').classList.toggle('hide', n !== 0);
      document.getElementById('refundCount').textContent = `Showing ${n} of ${refunds.length} refunds`;
    }

    async function askGeminiAssistant(e) {
      e.preventDefault();
      const question = document.getElementById('aiQuestionInput').value.trim();
      const apiKeyInput = document.getElementById('geminiApiKey');
      const apiKey = (apiKeyInput ? apiKeyInput.value : localStorage.getItem('tp_gemini_key') || '').trim();
      const outBox = document.getElementById('aiResponseBox');
      const btn = document.getElementById('aiAskBtn');

      if (!question) return;
      if (!apiKey) {
        outBox.classList.remove('hide');
        outBox.innerHTML = `<div class="alert-soft"><i class="bi bi-key me-2"></i>Please enter your Gemini API key above to run a live AI query. Your personalized profile and trip context is ready.</div>`;
        return;
      }

      localStorage.setItem('tp_gemini_key', apiKey);

      // Context Injection from localStorage
      const liveProfile = JSON.parse(localStorage.getItem('tp_profile') || 'null') || profile;
      const liveBookings = JSON.parse(localStorage.getItem('tp_bookings') || 'null') || bookings;
      const liveRefunds = JSON.parse(localStorage.getItem('tp_refunds') || 'null') || refunds;

      const travellerName = `${liveProfile.first} ${liveProfile.last}`.trim() || fullName();
      const activeUpcoming = liveBookings.filter(b => b.status === 'Confirmed');
      const completedTrips = liveBookings.filter(b => b.status === 'Completed');
      const pendingRefunds = liveRefunds.filter(r => r.status === 'Processing');

      const userContext = `
Traveller Name: ${travellerName}
Email: ${liveProfile.email}
City: ${liveProfile.city}, ${liveProfile.country}
Active Upcoming Bookings: ${activeUpcoming.map(b => `${b.name} (${b.dest}, ${b.dates}, ${b.travellers || 2} travellers, ₹${b.amount})`).join('; ') || 'None'}
Completed Trips: ${completedTrips.map(b => `${b.name} (${b.dest}, ${b.dates})`).join('; ') || 'None'}
Pending Refunds: ${pendingRefunds.map(r => `${r.id} for ${r.name} (₹${r.amount} via ${r.method}, requested ${r.requested})`).join('; ') || 'None'}
      `.trim();

      const promptText = `You are TripTora's friendly AI travel assistant. Answer concisely and helpfully using only this traveller context:\n\n${userContext}\n\nTraveller Question: ${question}`;

      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Loading`;
      outBox.classList.remove('hide');
      outBox.innerHTML = `<div class="ai-reply-box"><i class="bi bi-hourglass-split me-2"></i>Preparing response for ${escapeHtml(travellerName)}...</div>`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }] }]
          })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data?.error?.message || `Gemini API returned HTTP ${res.status}`);
        }

        const aiText = data?.candidates?.[0]?.content?.parts?.map(p => p.text).join('\n') || 'No response generated.';
        outBox.innerHTML = `
          <div class="d-flex align-items-center gap-2 mb-2">
            <span class="pill"><i class="bi bi-check-circle"></i> Personalized for ${escapeHtml(travellerName)}</span>
          </div>
          <div class="ai-reply-box">${escapeHtml(aiText)}</div>
        `;
      } catch (err) {
        outBox.innerHTML = `<div class="pill red d-flex p-3"><i class="bi bi-exclamation-triangle me-2"></i>Unable to reach Gemini API: ${escapeHtml(err.message)}</div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="bi bi-send"></i> Ask`;
      }
    }

    function saveProfile(e) {
      e.preventDefault();
      const f = new FormData(e.target);
      const email = String(f.get('email') || '').trim();
      if (!/^[^@]+@[^@]+\.[^@]+$/.test(email)) {
        notify('Please enter a valid email address.');
        return;
      }
      profile = {
        ...profile,
        first: String(f.get('first') || '').trim(),
        last: String(f.get('last') || '').trim(),
        dob: String(f.get('dob') || ''),
        nationality: String(f.get('nationality') || ''),
        email,
        phone: String(f.get('phone') || '').trim(),
        street: String(f.get('street') || ''),
        city: String(f.get('city') || ''),
        country: String(f.get('country') || '')
      };
      save();
      try {
        const sess = JSON.parse(localStorage.getItem('triptoraUser') || 'null');
        if (sess) {
          sess.accountEmail = sess.accountEmail || sess.email;
          sess.username = fullName();
          sess.email = profile.email;
          localStorage.setItem('triptoraUser', JSON.stringify(sess));
        }
      } catch (err) {}
      const navName = document.querySelector('.tt-user-name');
      if (navName) navName.textContent = fullName();
      notify('Your information has been saved.');
      go('profile');
    }

    function uploadPhoto(e) {
      const file = e.target.files[0];
      if (!file) return;
      if (!['image/jpeg', 'image/png'].includes(file.type)) {
        notify('Please choose a JPG or PNG image.');
        return;
      }
      if (file.size > 5 * 1024 * 1024) {
        notify('Photo must be 5 MB or smaller.');
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        uploadedPhoto = reader.result;
        modal(`
          <div class="modal-header">
            <h5 class="modal-title">Adjust your picture</h5>
            <button class="btn-close" data-bs-dismiss="modal" type="button" aria-label="Close"></button>

      };
      reader.readAsDataURL(file);

              </div>
              <div class="progress mt-2" style="height:5px"><div id="passBar" class="progress-bar" style="width:0%"></div></div>
              <small id="passHint" class="muted tiny">At least 12 characters, uppercase and lowercase letters, one number and one special character.</small>
            </div>
            <div class="mb-3">
              <label class="form-label">Confirm new password *</label>
              <input required type="password" id="confirmPass" class="form-control">
            </div>
            <div class="alert-success-soft tiny mb-3">Use a unique password you haven’t used elsewhere.</div>
            <div class="text-end">
              <button type="button" class="btn-outline-trip" onclick="go('profile')">Cancel</button>
              <button type="submit" class="btn-trip">Update Password</button>
            </div>
          </form>
          <section class="cardx">
            <h5>A small step for peace of mind</h5>
            <i class="bi bi-shield-check fs-1 text-danger"></i>
            <p class="muted mt-3">Use a unique password you haven’t used elsewhere. A password manager can help keep it safe.</p>
            <hr>
            <p class="muted">TripTora will never ask you to share your password by email or phone.</p>
            <strong class="text-danger">Current state: ready to update.</strong>
          </section>
        </div>
      `);
    }

    function passwordStrength() {
      const p = document.getElementById('newPass').value;
      const score = [p.length >= 12, /[A-Z]/.test(p) && /[a-z]/.test(p), /[0-9]/.test(p), /[^A-Za-z0-9]/.test(p)].filter(Boolean).length;
      document.getElementById('passBar').style.width = (score * 25) + '%';
      document.getElementById('passHint').textContent = score === 4 ? 'Strong password' : `Password strength: ${score}/4 requirements met`;
    }

    function changePassword(e) {
      e.preventDefault();
      const p = document.getElementById('newPass').value;
      const c = document.getElementById('confirmPass').value;
      if (p.length < 12 || !/[A-Z]/.test(p) || !/[a-z]/.test(p) || !/[0-9]/.test(p) || !/[^A-Za-z0-9]/.test(p)) {
        notify('Password must meet all four strength requirements.');
        return;
      }
      if (p !== c) {
        notify('New password and confirmation do not match.');
        return;
      }
      if (p === document.getElementById('currentPass').value) {
        notify('Choose a new password different from your current one.');
        return;
      }
      localStorage.setItem('tp_password_updated', new Date().toISOString());
      notify('Password updated successfully.');
      go('profile');
    }

    function togglePass(id) {
      const x = document.getElementById(id);
      if (x) x.type = x.type === 'password' ? 'text' : 'password';
    }

    function showDeleteAccountModal() {
      const session = window.getTripToraUser ? window.getTripToraUser() : null;
      const isAdmin = session && session.role === 'admin';
      const accountEmail = (session && (session.accountEmail || session.email)) || profile.email || '';
      const displayName = fullName() || (session && session.username) || 'TripTora User';

      if (isAdmin && accountEmail.toLowerCase() === 'admin@triptora.com') {
        modal(`
          <div class="modal-header">
            <h5 class="modal-title text-danger"><i class="bi bi-shield-lock me-2"></i>Administrator Account Protected</h5>
            <button class="btn-close" data-bs-dismiss="modal" type="button" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="alert-soft">
              Built-in administrator accounts (<strong>${escapeHtml(accountEmail)}</strong>) cannot be deleted.
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn-trip" data-bs-dismiss="modal" type="button">Close</button>
          </div>
        `);
        return;
      }

      modal(`
        <div class="modal-header">
          <h5 class="modal-title" style="color:#C0392B"><i class="bi bi-exclamation-triangle-fill me-2"></i>Delete Your Account?</h5>
          <button class="btn-close" data-bs-dismiss="modal" type="button" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="alert-danger-soft mb-3">
            <strong>This action is permanent and cannot be undone.</strong>
            <div class="tiny mt-1">Deleting your account will permanently remove your login credentials, personal profile details, and active session.</div>
          </div>
          <div class="d-flex justify-content-between my-2"><span class="muted">Account holder</span><strong>${escapeHtml(displayName)}</strong></div>
          <div class="d-flex justify-content-between my-2"><span class="muted">Registered email</span><strong>${escapeHtml(accountEmail || '—')}</strong></div>
          <label class="delete-confirm-box" for="confirmDeleteCheck">
            <input type="checkbox" id="confirmDeleteCheck" onchange="clearDeleteConfirmError()">
            <span class="tiny">I understand that my TripTora account will be permanently deleted and I will need to register again to use TripTora.</span>
          </label>
          <div id="deleteConfirmErr" class="tiny mt-2 hide" style="color:#C0392B;font-weight:600;"></div>
        </div>
        <div class="modal-footer">
          <button class="btn-outline-trip" data-bs-dismiss="modal" type="button">Keep Account</button>
          <button class="btn-danger-trip" id="confirmDeleteAccountBtn" type="button" onclick="confirmDeleteAccount()">
            <i class="bi bi-trash3"></i> Delete Account
          </button>
        </div>
      `);
    }

    function clearDeleteConfirmError() {
      const errEl = document.getElementById('deleteConfirmErr');
      if (errEl) {
        errEl.textContent = '';
        errEl.classList.add('hide');
      }
    }

    function confirmDeleteAccount() {
      const checkEl = document.getElementById('confirmDeleteCheck');
      const errEl = document.getElementById('deleteConfirmErr');
      if (!checkEl || !checkEl.checked) {
        if (errEl) {
          errEl.textContent = 'Please tick the confirmation box above to permanently delete your account.';
          errEl.classList.remove('hide');
        }
        if (checkEl) checkEl.focus();
        return;
      }

      const btn = document.getElementById('confirmDeleteAccountBtn');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Deleting...';
      }

      const result = window.deleteTripToraAccount
        ? window.deleteTripToraAccount()
        : { ok: false, message: 'Account deletion service unavailable.' };

      if (!result || !result.ok) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-trash3"></i> Delete Account';
        }
        if (errEl) {
          errEl.textContent = (result && result.message) || 'Unable to delete account.';
          errEl.classList.remove('hide');
        }
        return;
      }

      closeModalSafe();
    }

    function modal(content) {
      const body = document.getElementById('modalBody');
      const el = document.getElementById('actionModal');
      body.innerHTML = content;
      if (window.bootstrap && bootstrap.Modal) {
        bootstrap.Modal.getOrCreateInstance(el).show();
      } else {
        el.classList.add('show');
        el.style.display = 'block';
        el.style.background = 'rgba(0,0,0,0.45)';
        body.querySelectorAll('[data-bs-dismiss="modal"]').forEach(btn => {
          btn.onclick = closeModalSafe;
        });
      }
    }

    function closeModalSafe() {
      const el = document.getElementById('actionModal');
      if (window.bootstrap && bootstrap.Modal) {
        const inst = bootstrap.Modal.getInstance(el);
        if (inst) inst.hide();
      } else {
        el.classList.remove('show');
        el.style.display = 'none';
      }
    }

    window.addEventListener('hashchange', render);
    window.addEventListener('storage', render);
    window.addEventListener('DOMContentLoaded', render);
  </script>
</body>
</html>
