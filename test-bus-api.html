
<!DOCTYPE html>
<html>
<head>
    <title>Triptora Bus Search</title>
</head>

<body>

    <h1>Triptora - Search Buses</h1>

    <label>From:</label>
    <input type="text" id="from" placeholder="Enter source">

    <label>To:</label>
    <input type="text" id="to" placeholder="Enter destination">

    <button onclick="searchBuses()">Search Buses</button>

    <h2>Available Buses</h2>

    <div id="bus-data"></div>

    <script>

        let allBuses = [];

        // Load bus data from JSON
        async function loadBuses() {

            try {
                const response = await fetch('./data/buses.json');

                if (!response.ok) {
                    throw new Error("Unable to load bus data");
                }

                allBuses = await response.json();

                console.log("Bus data loaded:", allBuses);

            } catch (error) {
                document.getElementById("bus-data").innerHTML =
                    "Error loading bus data.";
                console.error(error);
            }
        }

        // Search buses by route
        function searchBuses() {

            const from = document.getElementById("from")
                .value.trim().toLowerCase();

            const to = document.getElementById("to")
                .value.trim().toLowerCase();

            if (!from || !to) {
                alert("Please enter both locations");
                return;
            }

            const results = allBuses.filter(bus =>
                bus.from.toLowerCase() === from &&
                bus.to.toLowerCase() === to
            );

            displayBuses(results);
        }

        // Display matching buses
        function displayBuses(buses) {

            const container = document.getElementById("bus-data");

            if (buses.length === 0) {
                container.innerHTML =
                    "<h3>No buses available for this route.</h3>";
                return;
            }

            container.innerHTML = buses.map(bus => `
                <div>
                    <h3>${bus.operator}</h3>
                    <p>Route: ${bus.from} → ${bus.to}</p>
                    <p>Bus Type: ${bus.busType}</p>
                    <p>Departure: ${bus.departure}</p>
                    <p>Arrival: ${bus.arrival}</p>
                    <p>Price: ₹${bus.price}</p>
                    <p>Available Seats: ${bus.seatsAvailable}</p>
                    <p>Rating: ${bus.rating}</p>
                    <hr>
                </div>
            `).join("");
        }

        // Load data when page opens
        loadBuses();

    </script>

</body>
</html>
